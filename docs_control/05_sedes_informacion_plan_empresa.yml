version: "1.0"
estado: "provisional_operativo"
criterio: "Cada concepto tiene una sede principal; fuera de ella solo se referencia."

sedes:
  identidad_negocio:
    sede_principal: "docs_control/00_contrato_identidad_negocio.md"
    puede_apoyarse_en:
      - "docs_consolidados/01_documento_rector_negocio.md"
      - "respuestas_plan_empresa/02_idea_negocio.md"

  preguntas_plan:
    sede_principal: "plan_empresa_guia/"
    puede_apoyarse_en:
      - "docs_organizacion/02_matriz_red_arce_fuentes_vacios.md"
      - "docs_organizacion/03_revision_critica_matriz_vacios.md"
      - "docs_organizacion/08_matriz_clasificacion_preguntas_red_arce.md"
    nota: "La matriz activa de Gate 1C es 08; 02 y 03 quedan como apoyo temporal."

  respuestas_taller:
    sede_principal: "respuestas_plan_empresa/"
    puede_apoyarse_en:
      - "docs_consolidados/"
      - "docs_fuentes/"
      - "docs_preparacion/preguntas_resueltas/"
    nota: "respuestas_plan_empresa/ solo debe contener respuestas finales o casi finales del Plan de Empresa. Las preguntas, investigaciones pendientes, clasificaciones, decisiones internas e insumos previos viven en docs_preparacion/preguntas_resueltas/."

  resolucion_preguntas:
    sede_principal: "docs_preparacion/preguntas_resueltas/"
    puede_apoyarse_en:
      - "plan_empresa_guia/"
      - "docs_organizacion/08_matriz_clasificacion_preguntas_red_arce.md"
      - "docs_preparacion/02_base_competencia_e_inspiradores.md"
      - "docs_preparacion/03_mapa_aportes_competencia_al_plan.md"
      - "docs_fuentes/"
      - "docs_organizacion/"
    nota: "Capa intermedia obligatoria entre preguntas guía y respuestas finales. Aquí viven preguntas extraídas, matrices de resolución e insumos saneados por capítulo."

  fuentes_originales:
    sede_principal: "docs_fuentes/"
    puede_apoyarse_en:
      - "docs_organizacion/01_inventario_fuentes.md"
      - "docs_organizacion/00_organizacion_documental_marketing/"

  decisiones:
    sede_principal: "docs_control/04_registro_decisiones.md"
    puede_apoyarse_en: []
