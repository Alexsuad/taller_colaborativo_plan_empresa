criterios_anexos:
  enviar_a_anexos:
    - "tablas largas"
    - "listados completos de fuentes"
    - "cálculos extensos"
    - "comparativas detalladas de competidores"
    - "evidencias documentales"
    - "transcripciones o extractos largos"
